
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorveteria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-produtos">
    <div class="cimamilk">

        <button class="voltar" onclick="history.back()">←</button>

        <h1>Milk Shakes</h1>
    </div>

    <div class="chocolate1">

        <button class="adicionar" onclick="adicionarMilkShake(this, 'Chocolate')">
            +
        </button>

        <img src="milk-chocolate.png" class="foto3">

        <div class="info3">
            <h1>Chocolate</h1>
            <h2><p class="preco-milk">R$ 14,00</p></h2>
        </div>

        <div class="tamanhos-milk">
            <button type="button" class="tamanho ativo" onclick="selecionarTamanho(this, 'P', 14)">P</button>
            <button type="button" class="tamanho" onclick="selecionarTamanho(this, 'M', 17)">M</button>
            <button type="button" class="tamanho" onclick="selecionarTamanho(this, 'G', 20)">G</button>
        </div>
    </div>

    <div class="morango">

        <button class="adicionar" onclick="adicionarMilkShake(this, 'Morango')">
            +
        </button>

        <img src="milk-morango.png" class="foto4">

        <div class="info4">
            <h1>Morango</h1>
            <h2><p class="preco-milk">R$ 14,00</p></h2>
        </div>

        <div class="tamanhos-milk">
            <button type="button" class="tamanho ativo" onclick="selecionarTamanho(this, 'P', 14)">P</button>
            <button type="button" class="tamanho" onclick="selecionarTamanho(this, 'M', 17)">M</button>
            <button type="button" class="tamanho" onclick="selecionarTamanho(this, 'G', 20)">G</button>
        </div>
    </div>

    <div class="ovo">

        <button class="adicionar" onclick="adicionarMilkShake(this, 'Ovo Maltine')">
            +
        </button>

        <img src="milk-chocolate.png" class="foto5">

        <div class="info5">
            <h1>Ovo Maltine</h1>
            <h2><p class="preco-milk">R$ 14,00</p></h2>
        </div>

        <div class="tamanhos-milk">
            <button type="button" class="tamanho ativo" onclick="selecionarTamanho(this, 'P', 14)">P</button>
            <button type="button" class="tamanho" onclick="selecionarTamanho(this, 'M', 17)">M</button>
            <button type="button" class="tamanho" onclick="selecionarTamanho(this, 'G', 20)">G</button>
        </div>
    </div>

    <div class="rodape">

        <div class="carrinho" onclick="window.location.href='carrinho.html'">

        <div class="carrinho-icone-container">
            <img src="Carrinho.webp" class="icone-carrinho">
            <span class="contador-carrinho" id="contador-carrinho">0</span>
        </div>

            <h2>Carrinho</h2>

        </div>
    </div>

    <div id="mensagem-carrinho" class="fundo-mensagem">
        <div class="caixa-mensagem">
            <div class="icone-sucesso">✓</div>

            <h2>Adicionado ao carrinho!</h2>

            <p id="mensagem-produto"></p>

            <button type="button" onclick="fecharMensagemCarrinho()">
                OK
            </button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
